name: build speechord

# Slim Windows-x64 build for the self-hosted "Speechord" desktop app.
# Reuses the upstream Fluxer build steps (native Rust voice modules + electron-builder)
# but skips the S3 / Azure-signing / Velopack-publish machinery, emitting an NSIS
# installer + portable exe as GitHub Release assets / workflow artifacts instead.

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a GitHub Release with the installer (otherwise only upload build artifacts)
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: speechord-desktop
  cancel-in-progress: true

env:
  BUILD_CHANNEL: stable
  CHANNEL: stable
  RELEASE_CHANNEL: stable
  DESKTOP_PLATFORM: windows
  DESKTOP_ARCH: x64
  # windows-game-capture variant: bundles @fluxer/win-game-capture, which is the ONLY
  # native screen-capture backend on Windows. Without it, screen share fails with
  # "native screen capture unavailable (disabled-by-launch)". DXGI screen/window capture
  # works unsigned; only game-window injection needs signing (that stays disabled, fine).
  DESKTOP_VARIANT: windows-game-capture
  FLUXER_DESKTOP_BUILD_VARIANT: windows-game-capture
  FLUXER_WINDOWS_GAME_CAPTURE_MODULE_ENABLED: "true"
  PLATFORM: windows
  ARCH: x64
  ELECTRON_ARCH: x64
  CI_MANIFEST: ${{ github.workspace }}/tools/ci/Cargo.toml

jobs:
  build:
    name: Build Speechord (windows x64)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Compute CalVer version
        id: ver
        shell: pwsh
        run: |
          $now = (Get-Date).ToUniversalTime()
          $minor = "$($now.Month)$($now.Day.ToString('D2'))"
          $micro = [int]$now.ToString('HHmmss')
          $v = "$($now.Year).$minor.$micro"
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Speechord version: $v"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: "1.93.0"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"

      - name: Ensure python3 command
        shell: pwsh
        run: cargo run --locked --quiet --manifest-path "$env:CI_MANIFEST" -- build-desktop --step ensure_python3_windows

      - name: Shorten Windows paths (subst W:) and pin pnpm store
        shell: pwsh
        env:
          SUBST_TARGET: ${{ github.workspace }}
        run: cargo run --locked --quiet --manifest-path "$env:CI_MANIFEST" -- build-desktop --step windows_paths

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24

      - name: Set up pnpm via corepack
        shell: pwsh
        run: cargo run --locked --quiet --manifest-path "$env:CI_MANIFEST" -- build-desktop --step setup_pnpm_corepack

      - name: Resolve pnpm store path
        shell: pwsh
        run: cargo run --locked --quiet --manifest-path "$env:CI_MANIFEST" -- build-desktop --step resolve_pnpm_store_windows

      - name: Set up MSVC env
        uses: TheMrMilchmann/setup-msvc-dev@79dac248aac9d0059f86eae9d8b5bfab4e95e97c
        with:
          arch: amd64

      - name: Install Rust Windows targets
        shell: pwsh
        run: cargo run --locked --quiet --manifest-path "$env:CI_MANIFEST" -- build-desktop --step install_rust_windows_targets

      - name: Install dependencies
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        shell: pwsh
        run: cargo run --locked --quiet --manifest-path "$env:CI_MANIFEST" -- build-desktop --step install_dependencies

      - name: Update version
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        shell: pwsh
        run: cargo run --locked --quiet --manifest-path "$env:CI_MANIFEST" -- build-desktop --step update_version

      - name: Set build channel
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        shell: pwsh
        run: cargo run --locked --quiet --manifest-path "$env:CI_MANIFEST" -- build-desktop --step set_build_channel

      # NB: run these two directly (not via `cargo run --step ...`). build.mjs internally
      # shells out to `cargo run ... set_build_channel`, which would relink the running
      # fluxer-ci.exe and fail with a Windows file lock if this step itself were fluxer-ci.exe.
      - name: Build Electron main process (native + main)
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        shell: pwsh
        env:
          NODE_ENV: production
          FLUXER_DESKTOP_PRODUCTION: "true"
        run: pnpm build

      - name: Build Electron app (electron-builder -> NSIS + portable)
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        shell: pwsh
        env:
          TEMP: C:\t
          TMP: C:\t
          ELECTRON_BUILDER_CACHE: C:\ebcache
        run: pnpm exec electron-builder --config electron-builder.config.cjs --win --x64

      # --- Self-signed Authenticode test: the official Fluxer build signs every Windows binary;
      # ours doesn't, and screen share greens only on ours. Sign the app binaries (exe + native
      # .node/.dll) BEFORE Velopack packs them, so the binaries that actually run at runtime carry
      # a signature — testing whether Windows was degrading the unsigned native capture/encode path.
      # Ephemeral self-signed cert; the public .cer ships as a release asset for the user to trust
      # (Trusted Root + Trusted Publishers) before installing this build.
      - name: Self-sign Windows binaries (self-signed test cert)
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=Speechord Self-Sign" `
            -CertStoreLocation Cert:\CurrentUser\My -KeyExportPolicy Exportable -KeyUsage DigitalSignature `
            -NotAfter (Get-Date).AddYears(5)
          Export-Certificate -Cert $cert -FilePath "dist-electron/SpeechordSelfSign.cer" | Out-Null
          $files = Get-ChildItem "dist-electron/win-unpacked" -Recurse -Include *.exe,*.dll,*.node -ErrorAction SilentlyContinue
          $ok = 0
          $lastStatus = "<none>"
          foreach ($f in $files) {
            $r = Set-AuthenticodeSignature -FilePath $f.FullName -Certificate $cert -HashAlgorithm SHA256 -ErrorAction SilentlyContinue
            if ($r) { $lastStatus = $r.Status }
            # A self-signed cert is untrusted on the CI runner, so Status is 'UnknownError' even
            # though the file IS signed. What matters is that a signer certificate got attached.
            if ($r -and $r.SignerCertificate) { $ok++ }
          }
          Write-Host "Self-signed $ok / $($files.Count) binaries in win-unpacked (last status: $lastStatus)"
          if ($ok -eq 0) { throw "signing produced 0 signatures (last status: $lastStatus)" }

      # --- Velopack: turn the electron-builder win-unpacked app into an auto-updating
      # install. vpk pack emits a Velopack Setup.exe (what users install) plus the update
      # feed (releases.win.json + *-full.nupkg) the app polls at
      # speechord.com/dl/desktop/stable/win32/x64/windows-game-capture/. The app's
      # Updater.ts win32 path already uses `new UpdateManager(UPDATE_BASE_URL)`.
      - name: Set up .NET SDK (Velopack)
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: "8.0.x"

      - name: Install Velopack CLI (vpk, pinned to match the velopack npm runtime)
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        shell: pwsh
        run: cargo run --locked --quiet --manifest-path "$env:CI_MANIFEST" -- build-desktop --step install_velopack_cli

      - name: Package with Velopack (Speechord auto-update feed)
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        shell: pwsh
        run: |
          $vpk = Join-Path (Get-Location) ".velopack/vpk.exe"
          if (-not (Test-Path $vpk)) { throw "vpk not found at $vpk" }
          # NB: no --channel -> vpk emits releases.win.json (the feed `new UpdateManager()`
          # reads with its default win channel) AND the legacy Squirrel RELEASES file.
          & $vpk --yes pack `
            --packId speechord_desktop `
            --packVersion "$env:VERSION" `
            --packDir "dist-electron/win-unpacked" `
            --mainExe "Speechord.exe" `
            --packTitle "Speechord" `
            --packAuthors "Speechord" `
            --shortcuts "Desktop,StartMenu" `
            --runtime "win-x64" `
            --icon "build_resources/icons-stable/icon.ico" `
            --outputDir "dist-electron/velopack-windows-x64" `
            --delta BestSpeed
          if ($LASTEXITCODE -ne 0) { throw "vpk pack failed ($LASTEXITCODE)" }
          $dir = "dist-electron/velopack-windows-x64"
          # Rename the generated Setup to a clear, versioned name (Setup is standalone;
          # releases.win.json / RELEASES reference the nupkg, not the Setup, so this is safe).
          # Stable, unversioned name so speechord.com/download -> releases/latest/download/Speechord-Setup.exe
          # is always a direct one-click download of the newest build (version lives in the release tag).
          $setup = Get-ChildItem $dir -Filter "*-Setup.exe" | Select-Object -First 1
          if ($setup) { Rename-Item $setup.FullName "Speechord-Setup.exe" }
          if (-not (Test-Path "$dir/releases.win.json")) { throw "releases.win.json missing" }
          if (-not (Get-ChildItem $dir -Filter "*-full.nupkg")) { throw "full nupkg missing" }
          Get-ChildItem $dir | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,2)}} | Format-Table -AutoSize

      - name: List build outputs
        shell: pwsh
        run: |
          $out = "${{ github.workspace }}/fluxer_desktop/dist-electron"
          Get-ChildItem $out -File -ErrorAction SilentlyContinue | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}} | Format-Table -AutoSize

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: speechord-windows-x64
          if-no-files-found: error
          path: |
            ${{ github.workspace }}/fluxer_desktop/dist-electron/velopack-windows-x64/*
            ${{ github.workspace }}/fluxer_desktop/dist-electron/*.exe

      - name: Publish GitHub Release
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v${{ steps.ver.outputs.version }}
          name: Speechord ${{ steps.ver.outputs.version }}
          body: |
            Speechord desktop (Windows x64) — a self-hosted build of Fluxer pointed at https://speechord.com.

            **Install:** get it from **https://speechord.com/download** (or the **Speechord-Setup.exe** asset below) and run it.
            This is a Velopack installer, so the app auto-updates itself from future releases (no reinstall needed after this one).
            The `-portable-` exe is a no-install alternative that does not auto-update.

            The `releases.win.json` + `.nupkg` assets are the auto-update feed (served via
            speechord.com/dl/desktop/…); they are not meant to be downloaded manually.

            Based on Fluxer (AGPL-3.0-or-later): https://github.com/fluxerapp/fluxer
            Source for this build: https://github.com/PlayrTBH/fluxer/tree/speechord
          files: |
            ${{ github.workspace }}/fluxer_desktop/dist-electron/velopack-windows-x64/Speechord-Setup.exe
            ${{ github.workspace }}/fluxer_desktop/dist-electron/velopack-windows-x64/*.nupkg
            ${{ github.workspace }}/fluxer_desktop/dist-electron/velopack-windows-x64/releases.win.json
            ${{ github.workspace }}/fluxer_desktop/dist-electron/velopack-windows-x64/RELEASES
            ${{ github.workspace }}/fluxer_desktop/dist-electron/SpeechordSelfSign.cer
            ${{ github.workspace }}/fluxer_desktop/dist-electron/*portable*.exe
